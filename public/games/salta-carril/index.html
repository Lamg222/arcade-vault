<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salta Carril</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #05130a; display: flex; justify-content: center; align-items: center; height: 100vh; }
    /* En móvil el canvas encoge para caber en el iframe preservando proporción; en escritorio nunca excede su tamaño natural (600x600). */
    canvas { display: block; image-rendering: pixelated; max-width: 100vw; max-height: 100dvh; width: auto; height: auto; }
  </style>
</head>
<body>
  <canvas id="game" width="600" height="600"></canvas>
  <script src="game.js"></script>
</body>
</html>
