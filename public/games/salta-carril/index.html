<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salta Carril</title>
  <link rel="stylesheet" href="../_shared/skins.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--page-bg, #05130a); display: flex; justify-content: center; align-items: center; height: 100vh; transition: background 0.25s; }
    /* En móvil el canvas encoge para caber en el iframe preservando proporción; en escritorio nunca excede su tamaño natural (600x600). */
    canvas { display: block; image-rendering: pixelated; max-width: 100vw; max-height: 100dvh; width: auto; height: auto; border: 1px solid var(--page-border, #05130a); transition: border-color 0.25s; }
    /* Cromo alrededor del canvas por skin. Los colores DENTRO del canvas viven en SKIN_PALETTES de game.js (el CSS no pinta píxeles del canvas). */
    body[data-skin="clasico"] { --page-bg: #05130a; --page-border: #10301c; }
    body[data-skin="neon"]    { --page-bg: #05010d; --page-border: #2a1240; }
    body[data-skin="retro"]   { --page-bg: #020e02; --page-border: #0f3a1a; }
    body[data-skin="claro"]   { --page-bg: #eef2ea; --page-border: #a8b8a8; }
  </style>
</head>
<body>
  <canvas id="game" width="600" height="600"></canvas>
  <script src="../_shared/skins.js"></script>
  <script src="game.js"></script>
</body>
</html>
